name: Lara Discussions Bridge (read-only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  discussions: read
  issues: write
jobs:
  read-discussions:
    if: github.repository == 'sportreiter/lara-fuer-alle' && github.event.issue.user.login == 'sportreiter' && startsWith(github.event.issue.title, '[LaraBridge]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout audited repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read GitHub Discussions
        env:
          LARA_REPO: ${{ github.repository }}
          LARA_EVENT_PATH: ${{ github.event_path }}
          LARA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/read_discussions.py
